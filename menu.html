<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weekly Menu – Two Plates</title>
  <meta name="description" content="This week's menu, planned with Two Plates.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { padding-bottom: 32px; }
    .menu-hero { text-align: center; padding: 28px 16px 8px; }
    .menu-hero img { width: 56px; height: 56px; }
    .menu-hero h1 { font-size: 1.6rem; margin: 10px 0 4px; letter-spacing: -0.02em; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .menu-item:first-of-type { border-top: 0; }
    .menu-item h3 { font-size: 1rem; margin: 0 0 2px; }
    .foot { text-align: center; margin-top: 18px; }
  </style>
</head>
<body>
  <main id="menu"></main>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
